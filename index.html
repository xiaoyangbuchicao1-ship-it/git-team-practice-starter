<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>知舟研发团队任务板</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="board">
    <p class="eyebrow">ZHI ZHOU · TEAM DEMO</p>
    <h1>文档处理任务板</h1>
    <p class="description">这是一个专门用于练习 Git 与 GitHub 团队协作的三文件项目。</p>

    <article class="task-card">
      <div>
        <span class="label">当前任务</span>
        <h2>年度报告.pdf</h2>
        <p id="statusText" class="status">等待处理</p>
      </div>
      <button id="statusButton" type="button">推进状态</button>
    </article>
  </main>

  <script src="app.js"></script>
</body>
</html>
